name: claim-reminder
channel: email
# Sent by the hourly wallet-reminder job (posts/src/wallet_reminders.py) on
# day 7, to people with collectibles saved off-chain and no wallet. Anyone
# with nothing saved off-chain is skipped. The button opens the app's
# connect-wallet sheet (nextvibe.io/u/wallet).
from: "Danylo from NextVibe <danylo@nextvibe.io>"
reply_to: "danylo@nextvibe.io"
subject: "{claim_headline}"
preheader: "It's saved on your profile. Connect a wallet and it goes on Solana in seconds, free."
link: "https://nextvibe.io/u/wallet"
text: |
  {claim_headline}

  Hey {first_name}, it's saved on your NextVibe profile and it's yours. It isn't on Solana yet only because you haven't connected a wallet.

  Saved off-chain ({claim_count}): {claim_items}.

  Connect a wallet and everything saved goes on Solana in one go. It's free and takes about 10 seconds:
  {link}

  On a Seeker, your Seed Vault wallet works. On an iPhone, Phantom, Solflare or Backpack.

  See you IRL,
  Danylo from NextVibe

  —
  You get this because you have collectibles saved on NextVibe. Unsubscribe: {unsubscribe}

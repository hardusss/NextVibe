name: first-tap-email
channel: email
# Send to segment "never-tapped": people who never did Tap to Meet. The card
# is their own teaser, "@username met @???"; the button opens Tap to Meet in
# the app (nextvibe.io/u/tap). Anyone who has tapped already is skipped.
from: "Danylo from NextVibe <danylo@nextvibe.io>"
reply_to: "danylo@nextvibe.io"
subject: "{first_name}, this card has your name on it 👀"
subject_b: "Who's your first tap, {first_name}?"
preheader: "Tap phones with anyone on NextVibe and the ??? becomes their name. It takes a second."
link: "https://nextvibe.io/u/tap"
text: |
  Your card is ready. It's missing one person.

  Hey {first_name}, you're on NextVibe, but you haven't tapped phones with anyone yet. This is the card waiting for you: @{username} met @???

  Tap phones with anyone and the ??? becomes their name.

  A selfie can be staged. A tap can't: it only works when you're actually together. Hold your phones back to back for a second and you both get:
  - a Proof of Meet card with both your names, the place and the time
  - +1 REP each
  - a post for X, already written. One tap and it's live.

  Make your first tap (opens Tap to Meet in NextVibe):
  {link}

  HOW IT WORKS
  1. Find anyone with NextVibe: a friend, a coworker, someone at a meetup.
  2. Open Profile → Tap to Meet (or the link above) and hold your phones back to back.
  3. They tap Confirm. Your card appears. Post it on X.

  No one around with NextVibe? Send a friend nextvibe.io. They'll be ready to tap in a minute.

  See you IRL,
  Danylo from NextVibe

  P.S. Only your first card says "#1 for @{username}". Make it count: {link}

  —
  You get this because you have a NextVibe account. Unsubscribe: {unsubscribe}

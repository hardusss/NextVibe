name: meet-card-email
channel: email
# Send to segment "meet-card". Every recipient sees their own latest meet: its
# card, and a button that opens X with the post already written (the app's
# own "Share on X" text). Anyone without a meet to share is skipped.
from: "Danylo from NextVibe <danylo@nextvibe.io>"
reply_to: "danylo@nextvibe.io"
subject: "There's proof you met @{meet_with} 👀"
subject_b: "{first_name}, post this before @{meet_with} does"
preheader: "Your Proof of Meet card is ready. One tap and it's on your X."
link: "{meet_x}"
text: |
  Pics or it didn't happen? Here's the proof.

  You tapped phones with @{meet_with} {meet_where}, and that moment now has its own card:
  {meet_link}

  Anyone can post a selfie. This card only exists because you and @{meet_with} actually met in real life.

  @{meet_with} has the same card. Post yours first.

  Post it on X (the post is already written, just hit Post):
  {link}

  HOW TAP TO MEET WORKS
  1. Open NextVibe → Profile → Tap to Meet.
  2. Hold your phones back to back for a second.
  3. You both get a card like this one. Post it.

  Every meet you've had has its own card: https://nextvibe.io/u/meets

  See you IRL,
  Danylo from NextVibe

  P.S. Your card with @{meet_with} won't post itself: {link}

  —
  You get this because you have a NextVibe account. Unsubscribe: {unsubscribe}
